# Railway multi-service deployment for commerce-agents.
#
# Three services, all built from the same repo root:
#
#   storefront-api   — UCP REST + Claude shopping agent (existing, port 8000)
#   storefront-mcp   — MCP streamable-HTTP server (new, port assigned by Railway)
#   gemini-demo      — Gemini × UCP + MCP Apps UI (new, port assigned by Railway)
#
# In the Railway dashboard:
#   1. Create service "storefront-api"  → Dockerfile  (already deployed)
#   2. Create service "storefront-mcp"  → Dockerfile.mcp
#   3. Create service "gemini-demo"     → Dockerfile.gemini
#
# After deploying storefront-mcp, copy its Railway-assigned public URL and set:
#   storefront-mcp  env: STOREFRONT_MCP_UNSAFE_ALLOW_NO_AUTH=1
#   gemini-demo     env: STOREFRONT_MCP_URL=https://<mcp-service>.up.railway.app/mcp
#                        UCP_BASE=https://diligent-flow-production-afd7.up.railway.app
#                        GEMINI_API_KEY=<your-key>

[build]
  dockerfilePath = "Dockerfile"

[[services]]
  name = "storefront-api"
  [services.build]
    dockerfilePath = "Dockerfile"

[[services]]
  name = "storefront-mcp"
  [services.build]
    dockerfilePath = "Dockerfile.mcp"

[[services]]
  name = "gemini-demo"
  [services.build]
    dockerfilePath = "Dockerfile.gemini"

# ── Merchant portal (SFCC BM integration) ────────────────────────────────────
#
# Two new services for embedding the merchant agent in SFCC Business Manager:
#
#   merchant-api   — FastAPI backend (Anthropic + Salesforce OMS), port 8000
#   merchant-web   — Next.js merchant portal, port 3105
#
# After deploying both:
#   1. Set merchant-api env vars: SF_INSTANCE_URL, SF_CLIENT_ID, SF_CLIENT_SECRET, ANTHROPIC_API_KEY
#   2. Set merchant-web env var:  NEXT_PUBLIC_API_URL=https://<merchant-api>.up.railway.app
#   3. Set BM Custom Preference:  merchantAgentWebUrl=https://<merchant-web>.up.railway.app

[[services]]
  name = "merchant-api"
  [services.build]
    dockerfilePath = "Dockerfile"
  [services.deploy]
    startCommand = "uvicorn salesforce.api.main_production:app --app-dir examples --host 0.0.0.0 --port 8000"

[[services]]
  name = "merchant-web"
  [services.build]
    builder = "NIXPACKS"
    buildCommand = "cd examples/salesforce/merchant-web && npm install && npm run build"
  [services.deploy]
    startCommand = "node examples/salesforce/merchant-web/.next/standalone/server.js"
