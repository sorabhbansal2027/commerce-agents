<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Commerce Agents — Directory Structure</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3349;
    --text: #e8eaf0;
    --muted: #8b90a8;
    --accent: #6c8ef7;
    --shopping: #6c8ef7;
    --merchant: #f7c26c;
    --common: #4ecdc4;
    --plugin: #e879f9;
    --green: #4ade80;
    --sf: #60a5fa;
    --railway: #a78bfa;
    --red: #f87171;
    --orange: #fb923c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Menlo', 'Consolas', 'Monaco', monospace; font-size: 13px; line-height: 1.55; }

  header { padding: 28px 32px 18px; border-bottom: 1px solid var(--border); font-family: 'Segoe UI', system-ui, sans-serif; }
  header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  header p  { color: var(--muted); font-size: 12px; margin-top: 3px; }

  /* ── toolbar ── */
  .toolbar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 32px; border-bottom: 1px solid var(--border);
    background: var(--surface); position: sticky; top: 0; z-index: 10;
  }
  .toolbar input {
    background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); font-size: 12px; padding: 5px 10px; outline: none; width: 220px;
    font-family: inherit;
  }
  .toolbar input:focus { border-color: var(--accent); }
  .btn {
    font-size: 11px; padding: 4px 12px; border-radius: 5px; cursor: pointer; border: 1px solid var(--border);
    background: var(--surface2); color: var(--muted); font-family: 'Segoe UI', sans-serif;
    transition: background 0.12s, color 0.12s;
  }
  .btn:hover { background: var(--border); color: var(--text); }

  /* ── legend ── */
  .legend { display: flex; gap: 16px; padding: 8px 32px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .leg { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); font-family: 'Segoe UI', sans-serif; }
  .leg-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

  /* ── tree ── */
  .tree { padding: 20px 32px 48px; }
  ul { list-style: none; padding-left: 0; }
  ul ul { padding-left: 20px; }

  li { display: block; }
  .node {
    display: flex; align-items: baseline; gap: 0; padding: 1px 0; cursor: default;
    border-radius: 4px; transition: background 0.1s;
  }
  .node:hover { background: var(--surface2); }

  .indent { color: var(--border); user-select: none; flex-shrink: 0; white-space: pre; }
  .toggle { cursor: pointer; width: 14px; flex-shrink: 0; color: var(--muted); user-select: none; }
  .toggle:hover { color: var(--text); }

  .icon { flex-shrink: 0; margin-right: 5px; font-size: 12px; }
  .name { color: var(--text); }
  .name.dir  { font-weight: 700; }
  .name.py   { color: #c792ea; }
  .name.ts   { color: #4ec9b0; }
  .name.tsx  { color: #4fc1ff; }
  .name.md   { color: var(--muted); }
  .name.json { color: var(--orange); }
  .name.toml { color: var(--orange); }
  .name.yml  { color: var(--merchant); }
  .name.sh   { color: var(--green); }
  .name.html { color: var(--red); }
  .name.env  { color: var(--merchant); }

  /* colour by role */
  .role-shopping .name.dir { color: var(--shopping); }
  .role-merchant .name.dir { color: var(--merchant); }
  .role-common   .name.dir { color: var(--common);   }
  .role-plugin   .name.dir { color: var(--plugin);   }
  .role-sf       .name.dir { color: var(--sf);       }
  .role-example  .name.dir { color: var(--green);    }

  .anno {
    margin-left: 10px; font-size: 10px; color: var(--muted);
    font-family: 'Segoe UI', sans-serif; white-space: nowrap;
  }
  .anno.key { color: var(--accent); }
  .anno.shop { color: var(--shopping); }
  .anno.merch { color: var(--merchant); }
  .anno.common { color: var(--common); }
  .anno.plugin { color: var(--plugin); }
  .anno.sf { color: var(--sf); }

  /* collapsed children */
  .children.collapsed { display: none; }

  /* search highlight */
  .node.hidden { display: none; }
  .node.match .name { background: rgba(108,142,247,0.25); border-radius: 2px; }
</style>
</head>

// ── Render ─────────────────────────────────────────────
function extClass(name) {
  if (name.endsWith('/')) return 'dir';
  const m = name.match(/\.([a-z]+)$/i);
  if (!m) return '';
  const e = m[1].toLowerCase();
  if (e === 'py') return 'py';
  if (e === 'tsx') return 'tsx';
  if (e === 'ts') return 'ts';
  if (e === 'md') return 'md';
  if (e === 'json') return 'json';
  if (e === 'toml') return 'toml';
  if (e === 'yml' || e === 'yaml') return 'yml';
  if (e === 'sh') return 'sh';
  if (e === 'html') return 'html';
  if (e === 'env' || name.startsWith('.env')) return 'env';
  if (e === 'cls' || e === 'trigger') return 'py'; // Apex
  return '';
}

function fileIcon(name) {
  if (name.endsWith('/')) return '📁';
  const n = name.toLowerCase();
  if (n.endsWith('.py') || n.endsWith('.cls') || n.endsWith('.trigger')) return '🐍';
  if (n.endsWith('.tsx')) return '⚛️';
  if (n.endsWith('.ts') && !n.endsWith('.tsx')) return '📘';
  if (n.endsWith('.md')) return '📝';
  if (n.endsWith('.json') || n.endsWith('.toml')) return '{}';
  if (n.endsWith('.yml') || n.endsWith('.yaml')) return '⚙️';
  if (n.endsWith('.sh')) return '🖥';
  if (n.endsWith('.html')) return '🌐';
  if (n.startsWith('.env') || n === '.env') return '🔑';
  if (n.endsWith('.css')) return '🎨';
  if (n.endsWith('.xml')) return '🏷';
  if (n.endsWith('.txt')) return '📄';
  return '📄';
}

let idCounter = 0;
function buildNode(node, depth) {
  const li = document.createElement('li');
  const isDir = Array.isArray(node.ch);
  const nodeDiv = document.createElement('div');
  nodeDiv.className = 'node' + (node.role ? ' role-' + node.role : '');
  nodeDiv.dataset.name = node.n.toLowerCase();

  // toggle
  const tog = document.createElement('span');
  tog.className = 'toggle';
  if (isDir) {
    tog.textContent = '▾';
  } else {
    tog.textContent = ' ';
    tog.style.cursor = 'default';
  }
  nodeDiv.appendChild(tog);

  // icon
  const icon = document.createElement('span');
  icon.className = 'icon';
  icon.textContent = fileIcon(node.n);
  nodeDiv.appendChild(icon);

  // name
  const nameSpan = document.createElement('span');
  nameSpan.className = 'name ' + (isDir ? 'dir' : extClass(node.n));
  nameSpan.textContent = node.n;
  nodeDiv.appendChild(nameSpan);

  // annotation
  if (node.a) {
    const anno = document.createElement('span');
    anno.className = 'anno ' + (node.ac || '');
    anno.textContent = '— ' + node.a;
    nodeDiv.appendChild(anno);
  }

  li.appendChild(nodeDiv);

  if (isDir) {
    const childId = 'ch-' + (++idCounter);
    const childUl = document.createElement('ul');
    childUl.id = childId;
    childUl.className = 'children';
    // default: collapse at depth >=3
    if (depth >= 3) childUl.classList.add('collapsed');

    for (const child of node.ch) {
      childUl.appendChild(buildNode(child, depth + 1));
    }
    li.appendChild(childUl);

    tog.addEventListener('click', () => {
      const collapsed = childUl.classList.toggle('collapsed');
      tog.textContent = collapsed ? '▸' : '▾';
    });
    if (depth >= 3) tog.textContent = '▸';
  }

  return li;
}

function render() {
  const root = document.getElementById('tree-root');
  root.appendChild(buildNode(T, 0));
}

function expandAll() {
  document.querySelectorAll('.children').forEach(el => el.classList.remove('collapsed'));
  document.querySelectorAll('.toggle').forEach(el => { if (el.textContent.trim() !== ' ') el.textContent = '▾'; });
}
function collapseAll() {
  document.querySelectorAll('.children').forEach(el => el.classList.add('collapsed'));
  document.querySelectorAll('.toggle').forEach(el => { if (el.textContent.trim() !== ' ') el.textContent = '▸'; });
}

function doSearch(q) {
  q = q.toLowerCase().trim();
  const nodes = document.querySelectorAll('.node');
  if (!q) {
    nodes.forEach(n => { n.classList.remove('hidden', 'match'); });
    return;
  }
  nodes.forEach(n => {
    const name = n.dataset.name || '';
    if (name.includes(q)) {
      n.classList.remove('hidden');
      n.classList.add('match');
      // show all ancestor <ul>
      let p = n.parentElement;
      while (p) {
        if (p.tagName === 'UL' && p.classList.contains('children')) {
          p.classList.remove('collapsed');
          const tog = p.previousElementSibling?.querySelector?.('.toggle');
          if (tog && tog.textContent.trim() !== ' ') tog.textContent = '▾';
        }
        p = p.parentElement;
      }
    } else {
      n.classList.add('hidden');
      n.classList.remove('match');
    }
  });
}

render();
