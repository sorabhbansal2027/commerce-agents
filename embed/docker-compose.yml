# Reference deployment: FastAPI + LiteLLM Bedrock proxy.
#
# Usage (local test or EC2):
#   export AWS_ACCESS_KEY_ID=...
#   export AWS_SECRET_ACCESS_KEY=...
#   export AWS_DEFAULT_REGION=us-east-1
#   docker compose up
#
# For ECS Fargate, convert these two services to a single task definition with two
# containers sharing a "localhost" network.  Assign a task IAM role that has
# bedrock:InvokeModel on the Claude model ARNs — then remove the AWS_* env vars
# from both containers (the role covers them).
#
# For Railway / Render: deploy only the commerce-api service and host LiteLLM
# as a separate Railway service; update ANTHROPIC_BASE_URL accordingly.

services:

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--detailed_debug"]
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "4000:4000"   # expose for local debugging; remove in production

  commerce-api:
    build:
      context: ..      # project root (Dockerfile lives there)
    ports:
      - "8000:8000"
    environment:
      # Points the Anthropic SDK at LiteLLM instead of api.anthropic.com.
      # No source files change — the SDK reads these two env vars automatically.
      ANTHROPIC_BASE_URL: http://litellm:4000
      ANTHROPIC_API_KEY: sk-litellm-key

      # Open CORS for the Salesforce OMS sandbox org URL.
      DEMO_ALLOWED_HOSTS: "*.salesforce.com,*.force.com,*.lightning.force.com,*.my.salesforce.com"
      CORS_ORIGINS: "https://ets2-org--1storedpro.sandbox.my.salesforce.com,https://ets2-org--1storedpro.sandbox.lightning.force.com"
    depends_on:
      litellm:
        condition: service_healthy
